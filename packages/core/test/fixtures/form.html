<form class="signup" name="signup">
  <label for="email">Work email</label>
  <input id="email" name="email" type="email" placeholder="you@company.com">
  <label>Full name <input name="fullname" type="text"></label>
  <span id="pw-label">Password</span>
  <input name="password" type="password" aria-labelledby="pw-label">
  <label for="terms">Accept the terms</label>
  <input id="terms" name="terms" type="checkbox">
  <select name="plan"><option>Starter</option><option>Team</option></select>
  <textarea name="notes" placeholder="Anything else?"></textarea>
  <input type="submit" value="Create account">
  <img src="/logo.png" alt="Acme logo">
</form>
